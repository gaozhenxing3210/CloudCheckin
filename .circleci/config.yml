version: 2.1

jobs:
  nodeseek:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip
            pip install curl_cffi python-dotenv
      - run:
          name: Run Nodeseek signin
          command: |
            python -m nodeseek.nodeseek

workflows:
  nodeseek_checkin:
    jobs:
      - nodeseek:
          context: checkincontext
